<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Replacement Visualization</title>
    <meta name="description" content="A tool to visualize page replacement algorithms like FIFO, LRU, and OPT.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            padding: 60px 20px;
        }

        h1 {
            text-align: center;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3rem;
            text-shadow: 0 0 20px rgba(129, 140, 248, 0.2);
        }

        .input-section {
            max-width: 800px;
            margin: 0 auto 4rem;
            background: rgba(30, 41, 59, 0.7);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--surface-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .input-label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 18px 20px;
            margin-bottom: 28px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            color: white;
            font-size: 1.25rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            background: rgba(0, 0, 0, 0.4);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 20px;
            border-radius: 14px;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Outfit', sans-serif;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        .results-area {
            max-width: 1200px;
            margin: 0 auto;
        }

        .summary-card {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 20px;
            padding: 30px 40px;
            border: 1px solid var(--surface-border);
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            opacity: 0;
            transform: translateY(20px);
        }

        .summary-info {
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .legend {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .dot.blue { background: #818cf8; box-shadow: 0 0 15px rgba(129, 140, 248, 0.5); }
        .dot.red { background: var(--danger); box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }

        .algo-container {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 3rem;
            border: 1px solid var(--surface-border);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            opacity: 0;
            transform: translateY(20px);
        }

        .algo-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--surface-border);
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .algo-title::before {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .table-wrapper {
            overflow-x: auto;
            padding-bottom: 25px;
            margin: 0 -10px;
            padding-left: 10px;
            padding-right: 10px;
        }

        .grid {
            display: inline-flex;
            gap: 10px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cell {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            font-size: 1.4rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .cell:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .ref-cell {
            background: rgba(129, 140, 248, 0.15);
            color: #a5b4fc;
            border-color: rgba(129, 140, 248, 0.3);
            margin-bottom: 12px;
            border-radius: 16px;
        }
        
        .ref-cell:hover {
            background: rgba(129, 140, 248, 0.25);
            color: white;
        }

        .fault-cell {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.8), rgba(220, 38, 38, 0.8));
            color: white;
            border: 1px solid rgba(239, 68, 68, 0.5);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
        }
        
        .fault-cell:hover {
            background: linear-gradient(135deg, rgba(239, 68, 68, 1), rgba(220, 38, 38, 1));
            box-shadow: 0 6px 25px rgba(239, 68, 68, 0.5);
            transform: translateY(-2px) scale(1.05);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-top: 40px;
            padding-top: 35px;
            border-top: 1px solid var(--surface-border);
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 24px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            background: rgba(0, 0, 0, 0.35);
        }

        .stat-label {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .stat-value.hits { color: var(--success); text-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        .stat-value.faults { color: var(--danger); text-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }

        /* Scrollbar */
        ::-webkit-scrollbar { height: 12px; width: 12px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 6px; border: 2px solid rgba(0,0,0,0); background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); border: 2px solid rgba(0,0,0,0); background-clip: padding-box; }

        /* Animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animated-appear {
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .input-section { padding: 25px; }
            .algo-container { padding: 25px; }
            .cell { width: 50px; height: 50px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <h1>Page Replacement Algorithms</h1>

    <div class="input-section">
        <label class="input-label" for="seq">Reference String</label>
        <input type="text" id="seq" value="7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1" placeholder="e.g. 7 0 1 2 0 3 0 4 2 3...">
        
        <label class="input-label" for="slots">Frame Size</label>
        <input type="number" id="slots" value="3" min="1">
        
        <button onclick="simulate()">Simulate Algorithms</button>
    </div>

    <div id="resultsArea" class="results-area" style="display:none;">
        <div class="summary-card" id="summaryCard">
            <div id="summaryText" class="summary-info"></div>
            <div class="legend">
                <div class="legend-item">
                    <div class="dot blue"></div> Reference Sequence
                </div>
                <div class="legend-item">
                    <div class="dot red"></div> Page Fault Replaced
                </div>
            </div>
        </div>
        <div id="methodsContainer"></div>
    </div>

<script>
function simulate() {
    const rawInput = document.getElementById('seq').value;
    const pages = rawInput.trim().split(/[\s,]+/).filter(x => x !== "");
    const capacity = parseInt(document.getElementById('slots').value) || 3;
    
    if(pages.length === 0) return;

    const resultsArea = document.getElementById('resultsArea');
    resultsArea.style.display = 'block';
    
    const summaryCard = document.getElementById('summaryCard');
    summaryCard.className = 'summary-card'; // reset class
    // Trigger reflow to restart animation
    void summaryCard.offsetWidth;
    summaryCard.classList.add('animated-appear');

    document.getElementById('summaryText').innerHTML = `
        <div style="margin-bottom: 10px;"><span style="color:var(--text-muted); text-transform: uppercase; font-size: 0.85em; letter-spacing: 1px;">Sequence Sequence</span><br> <strong style="color:white; letter-spacing: 2px; font-size: 1.2em;">${pages.join(' ')}</strong></div>
        <div style="display: flex; gap: 40px; margin-top: 15px;">
            <div><span style="color:var(--text-muted); text-transform: uppercase; font-size: 0.85em; letter-spacing: 1px;">Frame Size</span><br> <strong style="color:white; font-size: 1.2em;">${capacity}</strong></div>
            <div><span style="color:var(--text-muted); text-transform: uppercase; font-size: 0.85em; letter-spacing: 1px;">References</span><br> <strong style="color:white; font-size: 1.2em;">${pages.length}</strong></div>
        </div>
    `;

    const methods = [
        { name: "FIFO (First In First Out)", type: "FIFO" },
        { name: "LRU (Least Recently Used)", type: "LRU" },
        { name: "OPT (Optimal Reference)", type: "OPT" }
    ];

    const container = document.getElementById('methodsContainer');
    container.innerHTML = "";

    methods.forEach((m, idx) => {
        const result = calculate(pages, capacity, m.type);
        renderAlgo(m.name, pages, result.history, result.faults, capacity, idx);
    });

    setTimeout(() => {
        window.scrollTo({ top: resultsArea.offsetTop - 40, behavior: 'smooth' });
    }, 100);
}

function calculate(pages, capacity, type) {
    let memory = [];
    let history = [];
    let faults = 0;
    let lruOrder = [];

    pages.forEach((p, idx) => {
        let isHit = memory.includes(p);
        let replacedIdx = -1;

        if (!isHit) {
            faults++;
            if (memory.length < capacity) {
                memory.push(p);
                replacedIdx = memory.length - 1;
            } else {
                let mIdx = 0;
                if (type === "FIFO") {
                    mIdx = (faults - 1) % capacity; 
                    memory[mIdx] = p;
                    replacedIdx = mIdx;
                } else if (type === "LRU") {
                    let valToReplace = lruOrder[0];
                    mIdx = memory.indexOf(valToReplace);
                    memory[mIdx] = p;
                    replacedIdx = mIdx;
                } else {
                    let farthest = -1;
                    mIdx = 0;
                    for (let i = 0; i < memory.length; i++) {
                        let next = pages.slice(idx + 1).indexOf(memory[i]);
                        if (next === -1) { mIdx = i; break; }
                        if (next > farthest) { farthest = next; mIdx = i; }
                    }
                    memory[mIdx] = p;
                    replacedIdx = mIdx;
                }
            }
        }

        if (type === "LRU") {
            if (isHit) {
                lruOrder.splice(lruOrder.indexOf(p), 1);
            } else if (lruOrder.length >= capacity) {
                lruOrder.shift();
            }
            lruOrder.push(p);
        }

        history.push({ mem: [...memory], replacedIdx: replacedIdx, isHit: isHit, page: p });
    });

    return { history, faults };
}

function renderAlgo(title, pages, history, faults, capacity, idx) {
    let hits = pages.length - faults;
    let hitRate = ((hits / pages.length) * 100).toFixed(1);
    let animDelay = (idx + 1) * 0.15;

    let html = `
        <div class="algo-container animated-appear" style="animation-delay: ${animDelay}s">
            <div class="algo-title">${title}</div>
            <div class="table-wrapper">
                <div class="grid">
    `;

    pages.forEach((p, i) => {
        html += `<div class="column"><div class="cell ref-cell">${p}</div>`;
        for (let j = 0; j < capacity; j++) {
            let val = history[i].mem[j] !== undefined ? history[i].mem[j] : "";
            let isFaultCell = !history[i].isHit && history[i].replacedIdx === j;
            html += `<div class="cell ${isFaultCell ? 'fault-cell' : ''}">${val}</div>`;
        }
        html += `</div>`;
    });

    html += `</div></div>
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Hits</div>
                <div class="stat-value hits">${hits}</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Page Faults</div>
                <div class="stat-value faults">${faults}</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Hit Rate</div>
                <div class="stat-value" style="color: #60a5fa; text-shadow: 0 0 20px rgba(96, 165, 250, 0.3);">${hitRate}%</div>
            </div>
        </div>
    </div>`;

    let container = document.getElementById('methodsContainer');
    container.insertAdjacentHTML('beforeend', html);
}
</script>
</body>
</html>
